# Workflow réutilisable : contrôles post-déploiement et surveillance des sites.
#
# Un site l'appelle **par SHA** (jamais par tag ni branche — un commit malveillant poussé dans le
# socle s'exécuterait avec les secrets des deux sites) :
#
#   jobs:
#     controles:
#       uses: colivinglemans-prog/sejour-socle/.github/workflows/deploy-checks.yml@<sha>
#       with: { site_name: "Coliving Barbusse", level: vital }
#       secrets:
#         BEDS24_MONITOR_TOKEN: ${{ secrets.BEDS24_MONITOR_TOKEN }}
#         NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
#
# Les secrets sont passés **un par un**, jamais `secrets: inherit`.
#
# Le site doit avoir un script `npm run test:deploy` (vitest + `defineDeploySuite`).
#
# Règles de ce fichier (cerbere) :
# - `npm ci` tourne sans aucun secret dans l'environnement ;
# - les secrets ne sont posés qu'au niveau de l'étape qui les utilise, par `env:` ;
# - aucune valeur d'entrée n'est interpolée `${{ }}` dans un `run:` — elles passent par `env:` ;
# - l'issue publique `surveillance-ko` ne contient que des identifiants de contrôle et un lien ;
#   le détail part par ntfy, dont le topic est lui-même le secret.

name: deploy-checks

on:
  workflow_call:
    inputs:
      site_name:
        description: Nom du site dans les alertes
        type: string
        required: true
      level:
        description: "`vital` (horaire) ou `full` (quotidien et post-déploiement)"
        type: string
        default: full
      base_url:
        description: URL testée (vide = URL canonique du site)
        type: string
        default: ""
      alert:
        description: Gérer l'issue surveillance-ko et les notifications ntfy
        type: boolean
        default: true
      max_green_age_hours:
        description: "Âge maximal du dernier run vert avant alerte « la surveillance a sauté » (0 = pas de contrôle)"
        type: number
        default: 0
      node_version:
        type: string
        default: "24"
      run_label:
        description: Suffixe du nom du rapport, si un même run appelle ce workflow plusieurs fois
        type: string
        default: main
    secrets:
      BEDS24_MONITOR_TOKEN:
        required: false
      DEPLOY_VIEWER_PASSWORD:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      NTFY_TOPIC:
        required: false

permissions: {}

jobs:
  checks:
    name: contrôles ${{ inputs.level }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    env:
      TZ: Europe/Paris
      NEXT_TELEMETRY_DISABLED: "1"
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      # Le lock référence le socle (dépôt public) en git+ssh ; pas de clé SSH sur le runner.
      - name: Socle en HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Dépendances (sans secret)
        run: npm ci --no-audit --no-fund

      # L'état d'alerte précédent vit dans le corps de l'issue ouverte, entre deux marqueurs.
      - name: État d'alerte précédent
        if: inputs.alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh issue list --repo "$GITHUB_REPOSITORY" --label surveillance-ko --state open \
                   --limit 1 --json body --jq '.[0].body // ""')
          state=$(printf '%s' "$body" | sed -n 's/.*<!-- alert-state:\([A-Za-z0-9+/=]*\) -->.*/\1/p' | head -n1)
          if [ -n "$state" ]; then printf '%s' "$state" | base64 -d > "$RUNNER_TEMP/alert-prev.json"; fi

      - name: Contrôles
        id: run
        continue-on-error: true
        env:
          DEPLOY_BASE_URL: ${{ inputs.base_url }}
          DEPLOY_LEVEL: ${{ inputs.level }}
          DEPLOY_REPORT: ${{ runner.temp }}/deploy-report.json
          DEPLOY_ALERT_PREV: ${{ inputs.alert && format('{0}/alert-prev.json', runner.temp) || '' }}
          BEDS24_MONITOR_TOKEN: ${{ secrets.BEDS24_MONITOR_TOKEN }}
          DEPLOY_VIEWER_PASSWORD: ${{ secrets.DEPLOY_VIEWER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:deploy

      - name: Rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-report-${{ inputs.level }}-${{ inputs.run_label }}
          path: ${{ runner.temp }}/deploy-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Résultat
        if: steps.run.outcome == 'failure'
        run: exit 1

  alert:
    name: alerte
    needs: checks
    if: always() && inputs.alert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: deploy-report-${{ inputs.level }}-${{ inputs.run_label }}
          path: report

      - name: Issue surveillance-ko
        id: decide
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SITE_NAME: ${{ inputs.site_name }}
          LEVEL: ${{ inputs.level }}
          MAX_GREEN_AGE_HOURS: ${{ inputs.max_green_age_hours }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        with:
          script: |
            const fs = require("fs");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const site = process.env.SITE_NAME;
            let report = null;
            try { report = JSON.parse(fs.readFileSync("report/deploy-report.json", "utf8")); } catch {}

            // Pas de rapport du tout : le job de contrôles a planté avant la fin (dépendances,
            // runner). C'est une panne de la surveillance, signalée comme telle — jamais un vert.
            if (!report || !report.alert) {
              if (process.env.CHECKS_RESULT !== "success") {
                core.setOutput("ntfy_priority", "4");
                core.setOutput("ntfy_title", `[Surveillance] ${site} : contrôles non exécutés`);
                core.setOutput("ntfy_body", `Le job de contrôles a échoué sans rapport.\n${runUrl}`);
              }
              return;
            }

            const { action, state, failingIds } = report.alert;
            const marker = `<!-- alert-state:${Buffer.from(JSON.stringify(state)).toString("base64")} -->`;
            // Corps PUBLIC : identifiants et lien uniquement. Aucune métrique, aucun détail.
            const publicBody = (ids) =>
              `Contrôles en échec (${report.level}) :\n\n${ids.map((i) => `- \`${i}\``).join("\n")}\n\n` +
              `Dernier run : ${runUrl}\n\nLe détail est envoyé par notification privée.\n\n${marker}`;

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, labels: "surveillance-ko", state: "open", per_page: 1,
            });
            const issue = open[0];

            // Détail privé pour ntfy : phrases écrites à la main et compteurs, jamais de réponse.
            const failing = report.results.filter((r) => failingIds.includes(r.id));
            const detail = failing
              .map((r) => `• ${r.title}${r.detail ? ` — ${r.detail}` : ""}`)
              .join("\n");

            if (action === "open" || (action !== "recover" && action !== "none" && !issue)) {
              await github.rest.issues.create({
                ...context.repo,
                title: `Surveillance KO — ${site}`,
                labels: ["surveillance-ko"],
                body: publicBody(failingIds),
              });
              core.setOutput("ntfy_priority", "5");
              core.setOutput("ntfy_title", `[Surveillance] ${site} : ${failingIds.length} contrôle(s) KO`);
              core.setOutput("ntfy_body", `${detail}\n${runUrl}`);
            } else if (action === "escalate" && issue) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body: publicBody(failingIds) });
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Nouveaux contrôles en échec. ${runUrl}` });
              core.setOutput("ntfy_priority", "5");
              core.setOutput("ntfy_title", `[Surveillance] ${site} : aggravation (${failingIds.length} KO)`);
              core.setOutput("ntfy_body", `${detail}\n${runUrl}`);
            } else if (action === "persist" && issue) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body: publicBody(failingIds) });
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Toujours en échec. ${runUrl}` });
            } else if (action === "recover" && issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Rétabli. ${runUrl}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
              core.setOutput("ntfy_priority", "3");
              core.setOutput("ntfy_title", `[Surveillance] ${site} : rétabli`);
              core.setOutput("ntfy_body", runUrl);
            }

            // « La surveillance a sauté » : dernier run vert du workflow appelant trop ancien.
            const maxAge = Number(process.env.MAX_GREEN_AGE_HOURS || 0);
            if (maxAge > 0) {
              const ref = process.env.GITHUB_WORKFLOW_REF || "";
              const file = (ref.split("@")[0].match(/\.github\/workflows\/[^/]+$/) || [])[0];
              if (file) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: file.split("/").pop(), status: "success", per_page: 1,
                });
                const last = data.workflow_runs[0];
                const ageH = last ? (Date.now() - new Date(last.updated_at).getTime()) / 3.6e6 : Infinity;
                if (ageH > maxAge && action === "none") {
                  core.setOutput("ntfy_priority", "4");
                  core.setOutput("ntfy_title", `[Surveillance] ${site} : aucun run vert depuis plus de ${maxAge} h`);
                  core.setOutput("ntfy_body", runUrl);
                }
              }
            }

      - name: Notification ntfy
        if: steps.decide.outputs.ntfy_title != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TITLE: ${{ steps.decide.outputs.ntfy_title }}
          BODY: ${{ steps.decide.outputs.ntfy_body }}
          PRIORITY: ${{ steps.decide.outputs.ntfy_priority }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC absent : notification ignorée"; exit 0; fi
          echo "::add-mask::$NTFY_TOPIC"
          # Titre accentué : encodage RFC 2047, comme lib/ntfy.ts.
          title_b64=$(printf '%s' "$TITLE" | base64 -w0)
          curl -sf -o /dev/null \
            -H "Title: =?UTF-8?B?${title_b64}?=" \
            -H "Priority: ${PRIORITY:-3}" \
            -H "Tags: rotating_light" \
            --data-binary "$BODY" \
            "$NTFY_TOPIC" || echo "Envoi ntfy en échec"
